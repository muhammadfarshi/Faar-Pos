name: faar_pos_app
description: FAAR POS — Professional Point of Sale System for retail and service businesses
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Database (offline-first SQLite) ──────────────────────────────────────
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Security ──────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Hardware — Barcode + Bluetooth Printing ───────────────────────────────
  mobile_scanner: ^6.0.10
  flutter_blue_plus: ^1.35.3
  esc_pos_utils_plus: ^2.0.3

  # ── Financial Math (NEVER use double for money) ───────────────────────────
  decimal: ^3.0.2
  rational: ^2.2.3

  # ── Utilities ─────────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0
  shared_preferences: ^2.3.2
  package_info_plus: ^8.1.3

  # ── Logging ───────────────────────────────────────────────────────────────
  talker_flutter: ^4.5.1
  talker_riverpod_logger: ^4.5.1

  # ── UI ────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  toastification: ^2.3.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <6.0.0'
  drift_dev: ^2.21.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
